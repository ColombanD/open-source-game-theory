name = "PrisonersDilemma"
version = "0.1.0"
# Metatheory UNPINNED from the default build 2026-08-11 (tau Milestone 1): the
# `tsearch` Prog constructor breaks every exhaustive match in the T31–T54 chain
# until its arms are written — that migration is Milestone 2 (see the Def-4
# section of TAUBOT_TRANSPARENCY_DESIGN.md). Still explicitly buildable via
# `lake build Metatheory`; restore it to defaultTargets when M2 lands.
defaultTargets = ["PrisonersDilemma", "OutcomeCheck"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

# The engine: agent language, proof system S, bot zoo, outcome theorems.
[[lean_lib]]
name = "PrisonersDilemma"

# The decidability metatheory (T31…T54): decFull, evalG, the gated systems,
# the modest universe, the instance-gate decider, the certified zoo.
# Builds on top of the engine; the engine never imports it.
[[lean_lib]]
name = "Metatheory"
roots = ["PrisonersDilemma.Decidability"]

# The outcome-theorem template gate. Separate root (not the `PrisonersDilemma.lean`
# index) because the app's library_writer appends `import` lines to that index, and Lean
# requires imports to precede commands. Building this target runs the validator + census.
[[lean_lib]]
name = "OutcomeCheck"
roots = ["PrisonersDilemma.Outcome.Check"]

# Serializes the @[outcome] cells to app/generated/outcome_theorems.json, which the
# Python matrix reads instead of regex-scraping the sources.
[[lean_exe]]
name = "export_outcomes"
root = "PrisonersDilemma.Outcome.Export"
