name = "ArithS"
version = "0.1.0"
defaultTargets = ["ArithS", "ArithSOutcomeCheck"]

# The arithmetized instance of S: PA (Foundation) + abstract action constants, a
# structural proof-length measure `len`, and the length-bounded provability predicate
# `Bew_k`. It requires Foundation at a pinned commit AND, since milestone M3 (the
# transfer theorem, Research/Notes/ARITHMETIZED_S_ROADMAP.md), the engine itself as a
# PATH dependency (`../engine`, one workspace on the same toolchain and the same mathlib
# commit). The dependency is one-way: the engine never imports ArithS.

[[require]]
name = "Foundation"
git = "https://github.com/FormalizedFormalLogic/Foundation"
rev = "58c76ac8b26cfda45d0d5430511750489d39b25a"

[[require]]
name = "PrisonersDilemma"
path = "../engine"

[[lean_lib]]
name = "ArithS"

# The four tiers of `ArithS/README.md` §1 as lake targets, each rooted at a one-file umbrella
# (`ArithS/Core.lean`, …). Lake does not enforce import direction between libraries of one package;
# `scripts/check_tiers.py` does (run it before a commit that adds an import).

[[lean_lib]]
name = "ArithSCore"
roots = ["ArithS.Core"]

[[lean_lib]]
name = "ArithSFrozen"
roots = ["ArithS.Frozen"]

[[lean_lib]]
name = "ArithSLoeb"
roots = ["ArithS.PBLT"]

[[lean_lib]]
name = "ArithSMatrix"
roots = ["ArithS.Matrix"]

[[lean_lib]]
name = "ArithSAudit"
roots = ["ArithS.Audit"]

# The S' outcome-theorem gate (the twin of the engine's `OutcomeCheck`): a separate root because it runs
# commands (the validator, the cell and floor censuses, the paper-zoo coverage — `ArithS/Outcome/Lint.lean`);
# in `defaultTargets` so every `lake build` runs them.
[[lean_lib]]
name = "ArithSOutcomeCheck"
roots = ["ArithS.Outcome.Check"]

# Serializes the @[outcomeA] cells and @[floorA] floors to app/generated/sprime_outcome_theorems.json.
[[lean_exe]]
name = "export_sprime_outcomes"
root = "ArithS.Outcome.Export"
