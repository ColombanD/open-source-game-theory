# Curated statuses for matchups WITHOUT an accepted outcome theorem.
#
# The Lean library only records proofs; "we know this is open" and "we tried
# and failed" are negative knowledge that lives here. Pairs are UNORDERED
# (["A", "B"] also covers B vs A). `reason` is for humans; the matrix renderer
# ignores it. A pair listed here that later gains a proven theorem is
# overridden by the proof (with a warning to drop the stale entry).
#
#   [[open]]   -> cell reads "Open Problem"
#   [[tried]]  -> cell reads "Tried"
#   [[rework]] -> cell reads "Need rework" (a proof exists, but not in the
#                 accepted large-k form — e.g. only `_floor` regime theorems)
#
# Anything not proven and not listed stays an empty cell (not yet attempted).
#
# A pair may appear in several sections; the strongest wins: open > rework >
# tried. Failed pipeline proof attempts append [[tried]] entries automatically;
# OUTCOME OPEN verdicts are recorded as [[open]] only after human confirmation
# in the app UI.

# ---- Genuinely open (semantic reasons) -------------------------------------

