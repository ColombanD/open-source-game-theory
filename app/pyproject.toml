[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pd-runner"
version = "0.1.0"
description = "Core of the OSGT Python layer: proven outcome matrices from the Lean exports, the tau layer (partial transparency), EGT analyses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pygambit>=16.7.0",
    "scipy>=1.17.1",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# The classic default set, pinned so both projects agree across ruff versions.
select = ["E4", "E7", "E9", "F"]
# E741: single-letter names (`l`) are used for "left" throughout the matrix code, beside `r`.
ignore = ["E741"]
